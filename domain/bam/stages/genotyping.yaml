extends: "_schema.yaml"
stage_id: "bam.genotyping"
status: "supported"
scope: "pre_hpc_pre_vcf"
domain: "bam"
benchmark_disposition: "benchmark_required"
benchmark_disposition_reason: "The stage has a permanent run reservation in the governed benchmark portfolio."
inputs:
  - name: "bam"
    data_type: "bam"
    cardinality: "One"
  - name: "bam_bai"
    data_type: "bai"
    cardinality: "One"
  - name: "reference"
    data_type: "fasta"
    cardinality: "One"
  - name: "sites"
    data_type: "vcf.gz"
    cardinality: "One"
  - name: "regions"
    data_type: "bed"
    cardinality: "One"
outputs:
  - name: "genotyping_report"
    data_type: "json"
    cardinality: "One"
  - name: "summary"
    data_type: "json"
    cardinality: "One"
  - name: "stage_metrics"
    data_type: "json"
    cardinality: "One"
  - name: "genotyping_bcf"
    data_type: "bcf"
    cardinality: "One"
  - name: "genotyping_vcf"
    data_type: "vcf.gz"
    cardinality: "One"
  - name: "genotyping_vcf_tbi"
    data_type: "tbi"
    cardinality: "One"
  - name: "genotyping_gl"
    data_type: "json"
    cardinality: "One"
parameters: []
metrics:
  - name: "runtime_s"
    meaning: "Wall-clock runtime in seconds"
  - name: "memory_mb"
    meaning: "Peak memory usage in MB"
description: "Likelihood-aware candidate-site genotyping from an indexed BAM and pinned reference resources."
required_inputs:
  - bam
  - bam_bai
  - reference
  - sites
  - regions
required_outputs:
  - genotyping_report
  - summary
  - stage_metrics
  - genotyping_bcf
  - genotyping_vcf
  - genotyping_vcf_tbi
  - genotyping_gl
tool_capability_requirements:
  - bam_input
invariants:
  - "stable_artifact_contract"
  - "deterministic_output_order"
allowed_missingness:
  - "none"
compatible_tools:
  - bcftools
defaults_source: "doc_ref:domain/bam/docs/DEFAULT_SETTINGS.md"
assumptions:
  - "The BAM and index share one coordinate-sorted alignment identity, and the reference, sites, regions, and ploidy policy are pinned together."
bank_hooks:
  - "none"
metrics_schema: "bijux.stage.metrics.v1"
planned_out_of_scope: []
