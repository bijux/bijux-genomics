schema_version = "bijux.benchmark.data_source.v1"
portfolio_id = "ancient-dna-damage-controls"
class = "production_real"
access_classification = "public"
redistribution_classification = "accession-referenced-derived-alignments"
access_terms_url = "https://www.ebi.ac.uk/ena/browser/about/policies"
attribution = "Cite the PRJEB19769 HLA study (doi:10.1038/s41598-020-64312-w), the PRJNA688065 dental-calculus decontamination study (doi:10.1038/s41598-021-86100-w), every contributing modern-read study, ENA, NCBI SRA, and the GRCh38 assembly."
projected_storage_bytes = 100000000000
projected_cpu_hours = 1500
projection_basis = "The projection reserves 100 GB and 1,500 CPU-hours for ten exact UDG/non-UDG pairs (18.2 GB of archived reads), one shotgun extraction blank, ten observational modern controls already selected by the repository, GRCh38, common-protocol alignments, orthogonal expectation records, and validation outputs."
truth_roles = ["ancient_damage_truth"]
truth_strategy = "paired_udg_treatment_labels_with_extraction_blank_and_observational_modern_negatives"
known_limitations = [
  "UDG treatment labels and published aggregate misincorporation ranges provide paired expectations, not per-molecule damage truth.",
  "UDG-treated libraries can retain terminal damage, and treatment, library construction, sequencing, and coverage differences can affect observed profiles.",
  "The extraction blank is from a separate ancient dental-calculus study and is a contamination control, not a matched human-library damage negative.",
  "Modern controls are observational negatives from different studies and library preparations, so analyses must remain stratified and may support false-positive checks but not matched effect-size estimates.",
  "No archive bytes, derived alignments, checksums, sample metadata table, held-out split, or orthogonal expectation table are admitted by this source declaration.",
]
description = "Ten exact ancient-human UDG/non-UDG library pairs anchor treatment-labeled damage discrimination, complemented by a sequenced extraction blank, observational modern controls, and a common GRCh38 alignment authority."
sample_context = "Ten same-individual ancient-human treatment pairs, one extraction blank, and ten stratified modern libraries."
assay_context = "Paired-end shotgun reads evaluated through a common GRCh38 alignment and terminal-damage protocol."
strata = ["individual", "library_treatment", "study", "truth_role"]
controls = ["extraction_blank", "modern_observational_negative", "udg_treated_pair"]
held_out_split = "Freeze six matched pairs for development, two for calibration, and two for final scoring; keep each pair in one partition."
lineage = "ENA and SRA runs plus treatment evidence to checksummed reads, alignments, expectation tables, and damage evidence."
allowed_uses = ["damage_discrimination", "false_positive_assessment", "performance", "robustness"]
data_types = ["bam", "fasta", "fastq", "orthogonal_assay", "sample_metadata"]
target_sample_count = 10

