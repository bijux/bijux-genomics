# owner = bijux-genomics-benchmarks
# purpose = Source authorities for environmental taxonomy and depletion truth
# authority = bijux-genomics-benchmarks
# stability = stable
# last_updated = 2026-08-16

schema_version = "bijux.benchmark.data_source.v1"
portfolio_id = "environmental-taxonomy-challenge"
class = "production_real"
access_classification = "public"
redistribution_classification = "accession-referenced-source-copy"
access_terms_url = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
attribution = "Cite the Human Microbiome Project mock-community study, NCBI, and every database snapshot authority."
projected_storage_bytes = 100000000000
projected_cpu_hours = 2000
projection_basis = "The selection reserves 100 GB and 2,000 CPU-hours for ten Tara Oceans libraries, ten HMP mock-community runs, exact host/rRNA/taxonomy reference snapshots, indexing, and validation."
truth_roles = ["environmental_taxonomy_truth", "host_and_rrna_challenge"]
truth_strategy = "real_edna_with_mock_community_and_orthogonal_assays"
known_limitations = [
  "The HMP mock community is a laboratory community rather than natural eDNA.",
  "Known membership does not by itself establish extraction efficiency or environmental matrix effects.",
  "Negative controls, host spike-ins, and orthogonal rRNA assays remain required before admission.",
]
description = "A source-defined mock-community anchor and immutable reference-database authority for taxonomy, host depletion, and rRNA depletion benchmarks."
sample_context = "Environmental metagenomes paired with a defined mock community, host material, rRNA expectations, and negatives."
assay_context = "Shotgun metagenomes classified against immutable taxonomy and sequence-database snapshots."
strata = ["environment", "host_fraction", "library_batch", "mock_abundance"]
controls = ["extraction_blank", "host_spike_in", "known_mock_membership", "rrna_orthogonal_assay"]
held_out_split = "Reserve environments and one mock abundance profile before database and threshold selection."
lineage = "Archive runs and database releases to checksummed reads and indexes to classification and depletion evidence."
allowed_uses = ["classification_accuracy", "depletion_accuracy", "performance", "robustness"]
data_types = ["fastq", "taxonomy_database"]
target_sample_count = 10

[[collections]]
id = "ena-tara-oceans"
authority = "European Nucleotide Archive"
accession = "PRJEB402"
source_url = "https://www.ebi.ac.uk/ena/browser/view/PRJEB402"
access_terms_url = "https://www.ebi.ac.uk/ena/browser/about/policies"
data_types = ["fastq"]
planned_sample_count = 10
selected_accessions = [
  "ERR1726937",
  "ERR1726950",
  "ERR318619",
  "ERR538187",
  "ERR594366",
  "ERR594380",
  "ERR598981",
  "ERR599370",
  "ERR599383",
  "ERR868408",
]
sample_era = "not_applicable"
selection_scope = "Ten exact paired-end WGS runs spanning surface, deep-chlorophyll-maximum, mesopelagic, oxygen-minimum, viral, bacterial, and protist fractions across independent Tara Oceans stations."
truth_basis = "Standardized global-ocean sampling, morphological and physicochemical contextual measurements, and published barcoding and metagenomic analyses establish real environmental diversity context."
known_limitations = [
  "Environmental community composition is observational and cannot be scored as complete taxonomic ground truth.",
  "The selected compressed FASTQ holdings total approximately 17.2 GB, but reference indexes and derived evidence remain additional storage obligations.",
]

[[collections]]
id = "hmp-mock-community"
authority = "NCBI BioProject and Sequence Read Archive"
accession = "PRJNA48341;SRP002397"
source_url = "https://www.ncbi.nlm.nih.gov/bioproject/48341"
access_terms_url = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
data_types = ["fastq"]
planned_sample_count = 10
selected_accessions = [
  "SRR042318",
  "SRR042328",
  "SRR042334",
  "SRR042347",
  "SRR042354",
  "SRR042364",
  "SRR042377",
  "SRR042386",
  "SRR042391",
  "SRR042548",
]
sample_era = "not_applicable"
selection_scope = "Ten exact 454 amplicon runs spanning ten protocol-validation experiments and both HMP mock-community sample records."
truth_basis = "The HMP mock material has declared organism membership and within-authority protocol-validation replication."
known_limitations = [
  "The selected runs are HMP-DACC 454 protocol-validation records and do not establish cross-center or Illumina repeatability.",
  "The source does not supply a representative environmental matrix or complete host and rRNA negative-control truth.",
]

[[collections]]
id = "ncbi-reference-database"
authority = "NCBI Reference Sequence and Taxonomy"
accession = "RefSeq+NCBI-Taxonomy"
source_url = "https://www.ncbi.nlm.nih.gov/refseq/"
access_terms_url = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
data_types = ["taxonomy_database"]
selection_scope = "One date-addressed database snapshot containing selected microbial, host, and ribosomal reference records with taxonomy identifiers."
truth_basis = "NCBI accession and taxonomy records provide the external sequence and lineage authority; a manifest will freeze exact records and release dates."
known_limitations = ["A mutable live database is not admissible; exact files, release identity, checksums, and exclusions remain to be materialized."]
