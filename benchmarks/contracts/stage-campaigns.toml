comparison_scope = "primary mapping counts from one governed coordinate-sorted EquCab3 BAM"
tool_ids = ["picard", "samtools"]
corpus_catalog_ids = ["ena-prjeb22390-err2112767-bam"]
reference_catalog_ids = []
database_catalog_ids = []
input_size_keys = ["bam_input_bytes", "bam_index_input_bytes"]
result_artifact = "mapping-summary.tsv"
runtime = "apptainer"
scheduler = "slurm"
container_only = true
threads = 1
warmup_repetitions = 1
measured_repetitions = 3
cache_policy = "warm"
result_root_template = "results/benchmarks/{run_id}-{slug}/{tool_id}"
accuracy_claim = "cross_tool_primary_mapping_summary_consistency_not_alignment_truth"
interpretation = "This campaign compares Picard and Samtools primary-read accounting under one explicit aggregation contract. Exact agreement establishes interoperable BAM flag interpretation for this corpus; it does not establish that the upstream alignments are biologically correct."
performance_metrics = [
  "wall_seconds",
  "cpu_seconds",
  "peak_rss_kib",
  "input_bytes",
  "output_bytes",
