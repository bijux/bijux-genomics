schema_version = "bijux.benchmark.stage_interfaces.v1"

[[interfaces]]
stage_id = "fastq.profile_reads"
accepted_input_contracts = [
  "bijux.fastq.artifact.single_end.v1",
  "bijux.fastq.artifact.paired_end.v1",
  "bijux.fastq.artifact.merged.v1",
]
output_contract = "bijux.fastq.profile_reads.report.v2"
normalized_result_contract = "benchmarks/contracts/schemas/fastq-profile-reads-result.schema.json"
parameter_schema_version = "bijux.fastq.params.stats.v1"
default_provider = "bijux_dna_domain_fastq::params::defaults::stats_defaults"
parameter_config = "benchmarks/contracts/config-pipeline-parameters.yml"
tool_ids = ["seqfu", "seqkit", "seqkit_stats"]
provenance_sources = [
  "crates/bijux-dna-domain-fastq/src/stages/contract/catalog.rs",
  "crates/bijux-dna-domain-fastq/src/params/quality/stats.rs",
  "crates/bijux-dna-domain-fastq/src/params/defaults/profiling.rs",
  "crates/bijux-dna-domain-fastq/src/artifacts/profile_reads.rs",
  "crates/bijux-dna-domain-fastq/src/observer/contracts/core.rs",
  "crates/bijux-dna-planner-fastq/src/tool_adapters/stages/qc/profile_reads.rs",
]

[interfaces.adapters]
seqfu = "bijux_dna_planner_fastq::tool_adapters::fastq::profile_reads"
seqkit = "bijux_dna_planner_fastq::tool_adapters::fastq::profile_reads"
seqkit_stats = "bijux_dna_planner_fastq::tool_adapters::fastq::profile_reads"

[interfaces.downstream_probe]
consumer_stage_id = "fastq.report_qc"
input_contract = "bijux.fastq.profile_reads.report.v2"
source = "bijux_dna_domain_fastq::artifacts::qc_bundle"
assertions = [
  "every retained tool report parses through the governed observer",
  "every normalized report contributes the same required QC fields",
  "the report-QC consumer accepts each tool result without tool-specific branching",
]
