# owner = bijux-genomics-benchmarks
# purpose = Stage-specific machine-evaluable benchmark data-fitness policy
# authority = bijux-dna-bench-model
# stability = stable
# last_updated = 2026-08-10

schema_version = "bijux.benchmark.data_fitness.v1"

[defaults]
minimum_real_samples = 10
minimum_cases_per_tool = 3
minimum_distinct_studies = 2
minimum_input_bytes = 1000000000

[exception_policy]
required_fields = ["dimension", "default_minimum", "permitted_minimum", "scientific_rationale", "compensating_evidence", "allowed_claims"]
review_authority = "bijux-dna-science"
claim_restriction_required = true

[[profiles]]
profile_id = "fastq-observational-qc"
minimum_real_samples = 10
minimum_cases_per_tool = 3
minimum_distinct_studies = 2
minimum_input_bytes = 1000000000
representativeness_strata = ["ancient", "modern", "single_end", "paired_end"]
required_layouts = ["fastq_single_end", "fastq_paired_end"]
truth_requirement = "observational_performance_only"
required_controls = ["technical_replicate", "negative_control"]
contamination_damage = "declare_and_stratify_if_present"
ancestry = "declare_and_stratify_if_present"
bias_assessments = ["study", "library_preparation", "read_length"]
required_limitations = ["cohort_nonrepresentativeness", "observational_truth_limit"]
allowed_claims = ["performance", "consistency"]
access = { stable_source_identity = true, license_identity = true, redistribution_classification = true, checksum_before_execution = true }
