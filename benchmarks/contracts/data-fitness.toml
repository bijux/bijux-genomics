[[profiles.scientific_exceptions]]
dimension = "minimum_real_samples"
default_minimum = 10
permitted_minimum = 1
scientific_rationale = "Reference indexing is evaluated per immutable reference, while representativeness is supplied by the required downstream real-sample alignment panel."
compensating_evidence = ["checksum-stable index reproduction", "downstream alignment across at least ten real samples"]
allowed_claims = ["performance", "reproducibility", "interoperability"]

[[profiles.scientific_exceptions]]
dimension = "minimum_distinct_studies"
default_minimum = 2
permitted_minimum = 1
scientific_rationale = "The indexed object is a single declared reference authority rather than a biological cohort; cross-study behavior is tested by downstream alignments."
compensating_evidence = ["declared contig policy", "alternate-contig coverage", "multi-study downstream alignment panel"]
allowed_claims = ["reproducibility", "interoperability"]

