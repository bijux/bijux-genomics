  "One modern horse library cannot establish cross-library correction or alignment performance.",
  "The read-prefix and reference subsets are qualification assets, not independent biological replicates.",
  "No read-level truth is available for base-correction or alignment-accuracy ranking.",
]

[[corpora]]
id = "viral-taxonomy-stage-qualification"
