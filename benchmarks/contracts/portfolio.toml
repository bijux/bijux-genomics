[[corpora]]
id = "human-short-read-diversity"
status = "admitted"
evidence_scope = "comparative"
class = "production_real"
sample_count = 20
data_types = ["fasta", "fastq"]
roles = ["short_read_diversity", "ancient_and_modern_reads", "single_and_paired_reads"]
source_specs = ["benchmarks/corpora/human-short-read-diversity.toml"]
catalog_ids = ["grch38-reference", "human-short-read-diversity"]
truth_strategy = "observational_only"
scientific_rationale = "Twenty public human accessions balance ancient and modern libraries, single- and paired-end layouts, and multiple input-size bands for real workload and robustness measurements; the checksum-admitted GRCh38 assembly binds reference-dependent stages without changing the cohort's observational truth scope."
limitations = [
  "The cohort is curated for workload diversity and is not population-representative.",
  "Library strategies and selections vary across studies, so comparisons must stratify or model this context.",
  "Observed biological reads do not by themselves provide base-level transformation truth.",
  "GRCh38 provides reference identity, not read-placement or variant truth.",
]

[[corpora]]
id = "ancient-horse-alignment-qualification"
status = "admitted"
evidence_scope = "qualification"
class = "qualification_real"
sample_count = 1
data_types = ["bam"]
roles = ["ancient_bam_qualification"]
catalog_ids = [
  "ena-prjeb22390-err2112767-bam",
  "ena-prjeb22390-err2112767-ngsbriggs-input",
  "ensembl-113-equcab3-refseq-genotyping-inputs-10mb",
  "ensembl-113-equcab3-refseq-known-sites-10mb",
  "ensembl-113-equcab3-variation",
  "equcab3-gcf-002863925.1",
  "equus-mitochondrial-candidates",
]
truth_strategy = "observational_only"
scientific_rationale = "A checksum-admitted ancient horse BAM supports container and metric-contract qualification without being misrepresented as a comparative cohort."
limitations = [
  "One sample cannot support biological generalization or tool ranking.",
  "Mapping-derived observations are not independent alignment truth.",
]

[[corpora]]
id = "human-population-stage-qualification"
status = "admitted"
evidence_scope = "qualification"
class = "qualification_real"
sample_count = 100
data_types = ["ibd_segments", "vcf"]
roles = ["human_population_stage_qualification"]
catalog_ids = [
  "1000-genomes-phase3-chr22-100-samples-ibdseq-segments-full-chromosome",
  "1000-genomes-phase3-chr22-biallelic-100-samples",
  "1000-genomes-phase3-chr22-biallelic-100-samples-full-chromosome",
  "1000-genomes-phase3-chr22-biallelic-20-22mb",
  "1000-genomes-phase3-chr22-ibdseq-segments",
]
truth_strategy = "observational_only"
scientific_rationale = "Checksum-admitted 1000 Genomes chromosome 22 panels and derived IBD segments provide real-data qualification for VCF, relatedness, and demographic stage contracts."
limitations = [
  "The cohort follows source header order and is not population-stratified.",
  "Single-chromosome and interval subsets cannot support genome-wide demographic inference, benchmark ranking, or chromosome-bootstrap uncertainty.",
  "Derived IBD segments validate downstream execution and formats but are not independent relationship truth.",
]

[[corpora]]
id = "amplicon-stage-qualification"
status = "admitted"
evidence_scope = "qualification"
class = "qualification_real"
sample_count = 1
data_types = ["fastq"]
roles = ["amplicon_stage_qualification"]
catalog_ids = [
  "ena-prjdb2953-drr021371",
  "ena-prjdb4000-drr037766",
  "mothur-miseq-sop-f3d0",
]
truth_strategy = "observational_only"
scientific_rationale = "Three checksum-admitted real amplicon runs cover paired-end, single-end, and overlapping-read ASV execution contracts."
limitations = [
  "Each governed source represents one sample and cannot establish cross-sample or population behavior.",
  "The sources lack a common independently measured composition and therefore cannot support ASV accuracy ranking or ecological interpretation.",
]

[[corpora]]
