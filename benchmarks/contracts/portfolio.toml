minimum_sample_count = 10
data_types = ["amplicon_reference", "fastq"]
roles = ["amplicon_truth"]
truth_strategy = "real_mock_communities_with_known_composition"
scientific_rationale = "Replicated real mock communities with known membership and abundance are needed to compare ASV, OTU, chimera, and normalization behavior."
limitations = ["No governed mock-community panel or independently declared expected composition is admitted."]
source_specs = ["benchmarks/corpora/amplicon-community-challenge.toml"]

[[corpora]]
id = "alignment-truth-panel"
status = "source_defined"
evidence_scope = "comparative"
class = "production_real"
sample_count = 0
minimum_sample_count = 10
data_types = ["bam", "fasta", "fastq"]
roles = ["alignment_truth"]
truth_strategy = "real_reference_material_with_orthogonal_truth_and_supplementary_simulation"
scientific_rationale = "Diverse real libraries tied to independently characterized reference material are needed for mapping correctness; simulation may test controlled edge cases but cannot replace the real panel."
limitations = ["No governed multi-sample alignment truth panel or common alignment scoring surface is admitted."]
source_specs = ["benchmarks/corpora/alignment-truth-panel.toml"]

[[corpora]]
id = "ancient-dna-bam-diversity"
status = "admitted"
evidence_scope = "comparative"
class = "production_real"
sample_count = 10
minimum_sample_count = 10
data_types = ["bam", "fasta"]
roles = ["bam_diversity"]
catalog_ids = ["ancient-dna-bam-diversity"]
truth_strategy = "observational_alignment_diversity_with_separate_orthogonal_controls"
scientific_rationale = "Multiple libraries spanning damage, depth, duplication, contamination, fragment length, and library preparation are required for defensible BAM-stage comparisons; independent damage controls are governed by a separate corpus authority."
limitations = [
  "The ten checksum-admitted ancient-human BAMs are observational and cannot serve as their own damage truth.",
  "Independent damage controls remain governed by the ancient-dna-damage-controls corpus.",
]
source_specs = ["benchmarks/corpora/ancient-dna-bam-diversity.toml"]

[[corpora]]
id = "ancient-dna-damage-controls"
status = "source_defined"
evidence_scope = "comparative"
class = "production_real"
sample_count = 0
minimum_sample_count = 10
data_types = ["bam", "fasta", "fastq", "orthogonal_assay", "sample_metadata"]
roles = ["ancient_damage_truth"]
truth_strategy = "paired_udg_treatment_labels_with_extraction_blank_and_observational_modern_negatives"
scientific_rationale = "Same-individual UDG/non-UDG library pairs provide independently labeled relative-damage expectations; an extraction blank and stratified modern libraries probe contamination and false-positive behavior without being misrepresented as per-molecule truth."
limitations = ["The selected sources, common-protocol alignments, checksums, treatment metadata, held-out split, and orthogonal expectation table are not yet admitted, and the design cannot establish per-molecule damage truth."]
source_specs = ["benchmarks/corpora/ancient-dna-damage-controls.toml"]

[[corpora]]
id = "variant-truth-panel"
status = "source_defined"
evidence_scope = "comparative"
class = "production_real"
sample_count = 0
minimum_sample_count = 10
data_types = ["bam", "genetic_map", "reference_panel", "vcf"]
roles = ["variant_truth"]
truth_strategy = "independently_curated_genotypes_with_mendelian_consistency"
scientific_rationale = "A diverse inheritance-supported truth cohort with immutable reference and map authorities is required for calling, filtering, transformation, and phasing accuracy."
limitations = ["No governed multi-sample truth VCF, pedigree partition, reference snapshot, or genetic-map snapshot is admitted."]
source_specs = ["benchmarks/corpora/variant-truth-panel.toml"]

[[corpora]]
id = "masked-genotype-truth-panel"
status = "source_defined"
evidence_scope = "comparative"
class = "production_real"
sample_count = 0
minimum_sample_count = 100
data_types = ["genetic_map", "reference_panel", "sample_metadata", "vcf"]
roles = ["masked_genotype_truth"]
truth_strategy = "held_out_high_coverage_genotypes_with_panel_exclusion"
scientific_rationale = "Phasing and imputation require independently held-out high-coverage genotypes, a frozen reference panel, and a genetic map, with evaluation samples excluded from the panel before masking."
limitations = ["No governed evaluation cohort, panel-exclusion receipt, genotype mask split, reference-panel snapshot, or genetic-map snapshot is admitted."]
source_specs = ["benchmarks/corpora/masked-genotype-truth-panel.toml"]

[[corpora]]
id = "ancient-population-panel"
status = "source_defined"
