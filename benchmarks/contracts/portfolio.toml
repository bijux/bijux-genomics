  "ena-prjeb10854-err1021817-full",
  "ena-prjeb10854-err1021817-read-prefix-100000",
  "ena-prjeb10854-err1021817-split-paired-fastq",
  "equcab3-nc_009144.3-first-megabase",
]
truth_strategy = "observational_only"
