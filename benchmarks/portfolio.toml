minimum_real_samples = 10
accuracy_strategy = "damage_and_authenticity_recovery_against_orthogonal_assays"
interchangeability = "canonical_damage_and_authenticity_report_contract"
downstream_probe = "consume every report through the same authentication decision surface"

[[profiles]]
id = "bam-biological-inference"
required_corpus_roles = ["bam_diversity", "variant_truth", "population_inference_truth"]
minimum_real_samples = 10
accuracy_strategy = "inference_specific_truth_and_sensitivity_analysis"
interchangeability = "canonical_inference_report_contract"
downstream_probe = "consume every result through the governed cohort aggregation and publication stages"

[[profiles]]
id = "vcf-calling"
required_corpus_roles = ["variant_truth", "ancient_damage_truth"]
minimum_real_samples = 10
accuracy_strategy = "precision_recall_genotype_concordance_and_damage_stratification"
interchangeability = "canonical_normalized_vcf_contract"
downstream_probe = "run QC, filtering, phasing, imputation, and population summaries on every callset"

[[profiles]]
id = "vcf-transformation"
required_corpus_roles = ["variant_truth", "masked_genotype_truth"]
minimum_real_samples = 10
accuracy_strategy = "truth_preservation_error_removal_and_record_normalization"
interchangeability = "canonical_normalized_vcf_contract"
downstream_probe = "run stats, phasing, imputation, and population consumers on every transformed VCF"

[[profiles]]
id = "vcf-phasing-imputation"
required_corpus_roles = ["variant_truth", "masked_genotype_truth"]
minimum_real_samples = 10
accuracy_strategy = "masked_concordance_switch_error_calibration_and_rare_variant_recovery"
interchangeability = "canonical_phased_or_imputed_vcf_contract"
downstream_probe = "run QC, association-neutral population summaries, and re-masking checks on every output"

[[profiles]]
id = "vcf-population-inference"
required_corpus_roles = ["population_inference_truth", "ancient_population_diversity"]
minimum_real_samples = 10
accuracy_strategy = "known_relationship_recovery_metadata_concordance_and_parameter_sensitivity"
interchangeability = "canonical_population_result_contract"
downstream_probe = "render every tool result through the same cohort interpretation and publication surface"

