[[corpora]]
id = "human-short-read-diversity"
status = "source_defined"
evidence_scope = "comparative"
real_data = true
sample_count = 20
data_types = ["fastq"]
roles = ["short_read_diversity", "ancient_and_modern_reads", "single_and_paired_reads"]
source_specs = ["benchmarks/corpora/human-short-read-diversity.toml"]
truth_strategy = "observational_only"
scientific_rationale = "Twenty public human accessions balance ancient and modern libraries, single- and paired-end layouts, and multiple input-size bands for real workload and robustness measurements."
limitations = [
  "The source specification is not yet materialized and checksum-admitted under the governed study data root.",
  "Observed biological reads do not by themselves provide base-level transformation truth.",
]

[[corpora]]
id = "ancient-horse-alignment-qualification"
status = "admitted"
evidence_scope = "qualification"
real_data = true
sample_count = 1
data_types = ["bam"]
roles = ["ancient_bam_qualification"]
catalog_ids = ["ena-prjeb22390-err2112767-bam", "equcab3-gcf-002863925.1"]
truth_strategy = "observational_only"
scientific_rationale = "A checksum-admitted ancient horse BAM supports container and metric-contract qualification without being misrepresented as a comparative cohort."
limitations = [
  "One sample cannot support biological generalization or tool ranking.",
  "Mapping-derived observations are not independent alignment truth.",
]

[[corpora]]
id = "read-processing-challenge"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["fastq"]
roles = ["read_processing_truth", "adapter_damage_complexity_challenge"]
truth_strategy = "real_reads_with_calibrated_spike_ins"
scientific_rationale = "Real libraries with independently quantified adapter, damage, duplicate, UMI, complexity, and low-quality signals are required to measure true retention and removal rather than only runtime."
limitations = ["The challenge panel, spike-in recipe, and independent truth observations are not yet admitted."]

[[corpora]]
id = "environmental-taxonomy-challenge"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["fastq", "taxonomy_database"]
roles = ["environmental_taxonomy_truth", "host_and_rrna_challenge"]
truth_strategy = "real_edna_with_mock_community_and_orthogonal_assays"
scientific_rationale = "Environmental and mock-community libraries with independently supported composition are needed for Kraken, Centrifuge, Kaiju, rRNA, and host-depletion sensitivity and specificity."
limitations = ["No governed eDNA panel, database snapshot, expected-taxon set, or negative controls are admitted."]

[[corpora]]
id = "amplicon-community-challenge"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["fastq", "amplicon_reference"]
roles = ["amplicon_truth"]
truth_strategy = "real_mock_communities_with_known_composition"
scientific_rationale = "Replicated real mock communities with known membership and abundance are needed to compare ASV, OTU, chimera, and normalization behavior."
limitations = ["No governed mock-community panel or independently declared expected composition is admitted."]

[[corpora]]
id = "alignment-truth-panel"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["fastq", "bam", "fasta"]
roles = ["alignment_truth"]
truth_strategy = "real_reference_material_with_orthogonal_truth_and_supplementary_simulation"
scientific_rationale = "Diverse real libraries tied to independently characterized reference material are needed for mapping correctness; simulation may test controlled edge cases but cannot replace the real panel."
limitations = ["No governed multi-sample alignment truth panel or common alignment scoring surface is admitted."]

[[corpora]]
id = "ancient-dna-bam-diversity"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["bam", "fasta"]
roles = ["bam_diversity", "ancient_damage_truth"]
truth_strategy = "real_ancient_libraries_with_orthogonal_authentication"
scientific_rationale = "Multiple libraries spanning damage, depth, duplication, contamination, fragment length, and library preparation are required for defensible BAM-stage comparisons."
limitations = ["Only one ancient horse BAM is currently checksum-admitted for qualification."]

[[corpora]]
id = "variant-truth-panel"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["bam", "vcf", "reference_panel", "genetic_map"]
roles = ["variant_truth", "masked_genotype_truth"]
truth_strategy = "independently_curated_genotypes_with_masked_truth"
scientific_rationale = "A diverse truth cohort with held-out genotypes, immutable panels, and genetic maps is required for calling, filtering, phasing, and imputation accuracy."
limitations = ["No governed multi-sample truth VCF, mask split, reference panel, or genetic map is admitted."]

[[corpora]]
id = "ancient-population-panel"
status = "missing"
evidence_scope = "comparative"
real_data = true
sample_count = 0
minimum_sample_count = 10
data_types = ["vcf", "genotype_likelihoods", "sample_metadata"]
roles = ["population_inference_truth", "ancient_population_diversity"]
truth_strategy = "real_cohort_with_independent_metadata_and_sensitivity_analysis"
scientific_rationale = "Population analyses require a cohort large and diverse enough to test missingness, relatedness, ancestry, sex, age, and low-coverage sensitivity without treating software agreement as truth."
limitations = ["No governed population cohort, metadata authority, or expected-result sensitivity surface is admitted."]

[[profiles]]
id = "fastq-observational-qc"
required_corpus_roles = ["short_read_diversity"]
minimum_real_samples = 10
accuracy_strategy = "cross_tool_consistency_with_independent_read_statistics"
interchangeability = "canonical_report_contract"
downstream_probe = "consume every tool report through the governed QC aggregation stage"

[[profiles]]
id = "fastq-read-transformation"
required_corpus_roles = ["short_read_diversity", "read_processing_truth"]
minimum_real_samples = 10
accuracy_strategy = "signal_specific_sensitivity_specificity_and_read_retention"
interchangeability = "canonical_fastq_and_report_contract"
downstream_probe = "feed every tool output into validation, QC, and alignment consumers"

[[profiles]]
id = "fastq-depletion"
required_corpus_roles = ["short_read_diversity", "environmental_taxonomy_truth"]
minimum_real_samples = 10
accuracy_strategy = "target_removal_and_non_target_retention_against_orthogonal_truth"
interchangeability = "canonical_fastq_and_depletion_report_contract"
downstream_probe = "feed every depleted output into taxonomy, QC, and alignment consumers"

[[profiles]]
id = "fastq-taxonomy"
required_corpus_roles = ["environmental_taxonomy_truth"]
minimum_real_samples = 10
accuracy_strategy = "taxon_precision_recall_abundance_error_and_negative_control_specificity"
interchangeability = "canonical_taxonomy_report_contract"
downstream_probe = "consume every classifier result through the same lineage and reporting stages"

[[profiles]]
id = "fastq-amplicon"
required_corpus_roles = ["amplicon_truth"]
minimum_real_samples = 10
accuracy_strategy = "community_membership_precision_recall_and_abundance_error"
interchangeability = "canonical_feature_table_and_sequence_contract"
downstream_probe = "feed every stage output into the next amplicon stage and common report generator"

[[profiles]]
id = "reference-index-build"
required_corpus_roles = ["alignment_truth"]
minimum_real_samples = 10
accuracy_strategy = "index_reproducibility_and_downstream_alignment_equivalence"
interchangeability = "tool_specific_index_with_canonical_reference_identity"
downstream_probe = "align the same real sample panel with every built index and validate canonical BAM outputs"

[[profiles]]
id = "bam-alignment"
required_corpus_roles = ["alignment_truth"]
minimum_real_samples = 10
accuracy_strategy = "mapping_correctness_variant_recovery_and_damage_stratified_error"
interchangeability = "canonical_coordinate_sorted_bam_contract"
downstream_probe = "run validation, mapping summary, coverage, filtering, and variant calling on every aligner output"

[[profiles]]
id = "bam-transformation"
required_corpus_roles = ["bam_diversity", "alignment_truth"]
minimum_real_samples = 10
accuracy_strategy = "expected_record_retention_and_truth_preservation"
interchangeability = "canonical_coordinate_sorted_bam_contract"
downstream_probe = "run validation, QC, and variant calling on every transformed BAM"

[[profiles]]
id = "bam-observational-qc"
required_corpus_roles = ["bam_diversity"]
minimum_real_samples = 10
accuracy_strategy = "cross_tool_consistency_with_independent_bam_statistics"
interchangeability = "canonical_bam_metrics_contract"
downstream_probe = "consume every report through the common QC and publication surface"

[[profiles]]
id = "bam-ancient-authentication"
