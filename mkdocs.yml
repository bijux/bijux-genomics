INHERIT: mkdocs.shared.yml

site_name: Bijux Genomics
site_description: "Contract-first genomics pipelines for FASTQ/BAM with reproducible runs and deterministic reporting."
site_url: !ENV [SITE_URL, https://bijux.io/bijux-genomics/]
site_author: Bijan Mousavi
repo_url: https://github.com/bijux/bijux-genomics
repo_name: bijux/bijux-genomics
edit_uri: ""

docs_dir: docs
site_dir: artifacts/docs/site

# The curated public navigation intentionally excludes internal reference
# pages, and MkDocs cannot resolve links from docs/ to governed repository-root
# contracts. The repository-aware `docs run check-doc-links` gate validates
# those targets; MkDocs remains strict for rendering, configuration, plugins,
# snippets, and links within its own documentation file set.
validation:
  nav:
    omitted_files: info
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info

extra:
  bijux:
    repository: bijux-genomics
    nav_mode: default
    theme_key: bijux:theme
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bijux/bijux-genomics
  # Analytics disabled for local builds (requires external template)
  copyright:
    text: "© 2025 Bijan Mousavi"
  release_tag: !ENV [RELEASE_TAG, "main"]

watch:
  - artifacts
  - docs
  - crates
  - configs
  - containers
  - makes

nav:
  - Home: index.md
  - Intro:
      - What Is Bijux Genomics: 00-intro/WHAT_IS_BIJUX.md
      - Start Here: 00-intro/QUICKSTART.md
      - Docs Map: 00-intro/DOCS_MAP.md
      - Glossary: 00-intro/GLOSSARY.md
      - Doc Promises: 00-intro/DOC_PROMISES.md
      - Scope: 00-intro/SCOPE.md
      - Refusals: 00-intro/REFUSALS.md
  - CLI:
      - Overview: cli/index.md
  - Architecture:
