[package]
name = "bijux-dna"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "bijux-dna"

[[bin]]
name = "bijux-dna"
path = "src/bin/bijux-dna.rs"

[dependencies]
bijux-dna-bench-stage = { workspace = true, features = ["execution"] }
bijux-dna-bench-campaign.workspace = true
bijux-dna-bench-parser-proofs = { workspace = true, features = ["fastq", "bam"] }
bijux-dna-bench-artifacts.workspace = true
bijux-dna-bench-fastq.workspace = true
bijux-dna-bench-hpc.workspace = true
bijux-dna-bench-vcf.workspace = true
bijux-dna-bench-bam-evidence.workspace = true
bijux-dna-bench-bam-proofs.workspace = true
bijux-dna-bench-bindings.workspace = true
bijux-dna-bench-vcf-evidence.workspace = true
bijux-dna-bench-population.workspace = true
bijux-dna-bench-haplotypes.workspace = true
bijux-dna-bench-genotypes.workspace = true
bijux-dna-bench-variants.workspace = true
bijux-dna-bench-workflows = { workspace = true, features = ["genomics"] }
bijux-dna-bench-corpus = { workspace = true, features = ["run-contract", "alignment", "variants", "panel-metadata"] }
bijux-dna-api.workspace = true
bijux-dna-core.workspace = true
bijux-dna-domain-bam.workspace = true
bijux-dna-domain-fastq.workspace = true
bijux-dna-domain-compiler.workspace = true
bijux-dna-domain-vcf.workspace = true
bijux-dna-db-ref.workspace = true
bijux-dna-infra.workspace = true
bijux-dna-db-ena.workspace = true
bijux-dna-planner-bam.workspace = true
bijux-dna-planner-fastq.workspace = true
bijux-dna-planner-vcf.workspace = true
bijux-dna-stages-fastq.workspace = true
bijux-dna-stages-vcf.workspace = true
bijux-dna-stage-contract.workspace = true
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
rayon.workspace = true
toml = { workspace = true }
sha2 = { workspace = true }
tar.workspace = true
flate2.workspace = true
reqwest.workspace = true
schemars.workspace = true
zip.workspace = true

[features]
bam_downstream = ["bijux-dna-api/bam_downstream", "bijux-dna-bench-bam-evidence/bam_downstream", "bijux-dna-bench-bam-proofs/bam_downstream"]
bench = ["bijux-dna-api/bench"]
docker-runner = ["bijux-dna-api/docker-runner"]
report-html = ["bijux-dna-api/report-html"]
default = []

[dev-dependencies]
bijux-dna-policies.workspace = true
bijux-dna-testkit.workspace = true
tempfile.workspace = true
predicates.workspace = true
insta = { workspace = true }
filetime.workspace = true
walkdir.workspace = true

[lints]
workspace = true
