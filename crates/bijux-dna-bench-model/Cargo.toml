[package]
name = "bijux-dna-bench-model"
version = "0.1.0"
edition = "2021"

license.workspace = true
rust-version.workspace = true
[dependencies]
anyhow = { workspace = true }
chrono.workspace = true
fastrand = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars.workspace = true
sha2.workspace = true
bijux-dna-core = { path = "../bijux-dna-core" }
bijux-dna-domain-fastq = { path = "../bijux-dna-domain-fastq", optional = true }
bijux-dna-domain-vcf = { path = "../bijux-dna-domain-vcf" }
bijux-dna-stage-contract = { path = "../bijux-dna-stage-contract" }

[lints]
workspace = true

[dev-dependencies]
bijux-dna-domain-fastq = { path = "../bijux-dna-domain-fastq" }
bijux-dna-testkit = { path = "../bijux-dna-testkit" }
toml.workspace = true

[features]
default = ["canonical-fastq-catalog"]
canonical-fastq-catalog = ["dep:bijux-dna-domain-fastq"]
