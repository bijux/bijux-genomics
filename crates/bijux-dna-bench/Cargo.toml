[package]
name = "bijux-dna-bench"
version = "0.1.0"
edition = "2021"

license.workspace = true
rust-version.workspace = true
[features]
container-qualification = ["dep:bijux-dna-policies"]

[dependencies]
bijux-dna-bench-stage = { workspace = true, features = ["repository"] }
bijux-dna-bench-corpus = { workspace = true, default-features = false, features = ["normalized"] }
bijux-dna-bench-artifacts.workspace = true
regex.workspace = true
bijux-dna-policies = { path = "../bijux-dna-policies", optional = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bijux-dna-core = { path = "../bijux-dna-core" }
bijux-dna-infra = { path = "../bijux-dna-infra", features = ["yaml"] }
bijux-dna-containers = { path = "../bijux-dna-containers" }
bijux-dna-runtime = { path = "../bijux-dna-runtime" }
bijux-dna-stage-contract.workspace = true
bijux-dna-science.workspace = true
bijux-dna-bench-model = { path = "../bijux-dna-bench-model" }
chrono.workspace = true
flate2.workspace = true
rayon.workspace = true
toml = { workspace = true }
serde_yaml = { workspace = true }
walkdir.workspace = true
bijux-dna-db-ena = { path = "../bijux-dna-db-ena" }
bijux-dna-db-ref.workspace = true
bijux-dna-domain-bam = { path = "../bijux-dna-domain-bam" }
md5.workspace = true

noodles-bam.workspace = true
noodles-sam.workspace = true

[dev-dependencies]
bijux-dna-analyze = { path = "../bijux-dna-analyze" }
bijux-dna-policies = { path = "../bijux-dna-policies" }
insta = { version = "1", features = ["json"] }
tempfile = { workspace = true }
bijux-dna-domain-fastq = { path = "../bijux-dna-domain-fastq" }
bijux-dna-testkit = { path = "../bijux-dna-testkit" }
