[package]
name = "bijux-dna-bench-corpus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
source-contract = ["dep:schemars"]
run-contract = ["dep:schemars", "dep:chrono"]
normalized = ["source-contract", "dep:bijux-dna-infra"]
alignment = ["dep:bijux-dna-domain-bam", "dep:bijux-dna-core", "dep:bijux-dna-infra"]
variants = ["dep:bijux-dna-domain-vcf"]
panel-metadata = ["dep:bijux-dna-db-ref", "dep:bijux-dna-infra", "dep:bijux-dna-domain-vcf"]

[dependencies]
chrono = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
flate2.workspace = true
bijux-dna-domain-bam = { workspace = true, optional = true }
bijux-dna-core = { workspace = true, optional = true }
bijux-dna-domain-vcf = { workspace = true, optional = true }

bijux-dna-db-ref = { workspace = true, optional = true }
bijux-dna-infra = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
