[package]
name = "bijux-dna-bench-workflows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
genomics = ["dep:bijux-dna-domain-bam", "dep:bijux-dna-domain-fastq", "dep:bijux-dna-domain-vcf", "dep:bijux-dna-stages-vcf", "dep:bijux-dna-db-ref"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
bijux-dna-core.workspace = true
bijux-dna-infra.workspace = true
bijux-dna-bench-corpus.workspace = true
bijux-dna-domain-bam = {workspace = true, optional = true}
bijux-dna-domain-fastq = {workspace = true, optional = true}
bijux-dna-domain-vcf = {workspace = true, optional = true}
bijux-dna-stages-vcf = {workspace = true, optional = true}
bijux-dna-db-ref = {workspace = true, optional = true}

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
