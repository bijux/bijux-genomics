schema_version: bijux.container.governance.v1
site:
  id: lunarc
  hostname_regex: '^(cosmos[0-9]+|cn[0-9]+)(\.int\.lunarc)?$'
paths:
  study_root: /home/bijan/lu2024-12-24/Dardel/STUDY
  containers_root: /home/bijan/lu2024-12-24/Dardel/STUDY/containers
  data_root: /home/bijan/lu2024-12-24/Dardel/STUDY/data
  results_root: /home/bijan/lu2024-12-24/Dardel/STUDY/results
  finalization_root: /home/bijan/lu2024-12-24/Dardel/STUDY/evidence/finalization
  active_repository: /home/bijan/bijux/bijux-genomics
  frozen_repositories: /home/bijan/bijux/bijux-genomics-runs
runtime:
  apptainer_architecture: linux/amd64
slurm:
  account: lu2026-2-20
  scratch_environment: SNIC_TMP
  partitions:
    - lu48
  quota_command:
    - projinfo
    - lu2026-2-20
