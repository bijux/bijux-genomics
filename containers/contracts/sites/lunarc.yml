  minimum_available_bytes: 107374182400
  minimum_available_inodes: 100000
  maximum_clock_skew_seconds: 30
  required_commands:
    - apptainer
    - date
    - df
    - git
    - hostname
    - projinfo
    - sacct
    - sacctmgr
    - sbatch
    - scontrol
    - sinfo
    - squeue
    - uname
  required_contracts:
    - benchmarks/schemas/pipeline-parameters.v1.json
    - benchmarks/schemas/stage-interfaces.v1.json
    - benchmarks/schemas/stage-report.v1.json
    - containers/contracts/config-governance.schema.json
    - containers/contracts/schemas/qualification-assessment.v1.json
