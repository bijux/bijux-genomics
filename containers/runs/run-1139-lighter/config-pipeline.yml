commands:
  version: [lighter, --version]
  help: [lighter, --help]
  real:
    - sh
    - -c
    - >-
      set -eu;
      mkdir -p /scratch/input /scratch/corrected /result/corrected;
      cp /input/ERR1021817_1.fastq.gz /scratch/input/ERR1021817_1.fastq.gz;
      cp /input/ERR1021817_2.fastq.gz /scratch/input/ERR1021817_2.fastq.gz;
      reference_bases=$(awk '{total += $2} END {printf "%.0f", total}' /input/EquCab3.0.fna.fai);
      test "$reference_bases" = 2506966135;
      lighter -r /scratch/input/ERR1021817_1.fastq.gz -r /scratch/input/ERR1021817_2.fastq.gz -K 31 "$reference_bases" -t 16 -od /scratch/corrected > /result/lighter.stdout.log 2> /result/lighter.stderr.log;
      scratch_mate1=/scratch/corrected/ERR1021817_1.cor.fq.gz;
      scratch_mate2=/scratch/corrected/ERR1021817_2.cor.fq.gz;
      gzip -t "$scratch_mate1" "$scratch_mate2";
      mate1_reads=$(gzip -cd "$scratch_mate1" | awk 'END {if (NR % 4 != 0) exit 2; printf "%.0f", NR / 4}');
      mate2_reads=$(gzip -cd "$scratch_mate2" | awk 'END {if (NR % 4 != 0) exit 2; printf "%.0f", NR / 4}');
      mate1_corrected=$(gzip -cd "$scratch_mate1" | awk 'NR % 4 == 1 && /cor/ {count++} END {printf "%.0f", count + 0}');
      mate2_corrected=$(gzip -cd "$scratch_mate2" | awk 'NR % 4 == 1 && /cor/ {count++} END {printf "%.0f", count + 0}');
      mate1_bytes=$(wc -c < "$scratch_mate1" | tr -d ' ');
      mate2_bytes=$(wc -c < "$scratch_mate2" | tr -d ' ');
      cp "$scratch_mate1" /result/corrected/ERR1021817_1.cor.fq.gz;
      cp "$scratch_mate2" /result/corrected/ERR1021817_2.cor.fq.gz;
      printf '{"reference_bases":%s,"mate1_reads":%s,"mate2_reads":%s,"mate1_corrected_headers":%s,"mate2_corrected_headers":%s,"mate1_output_bytes":%s,"mate2_output_bytes":%s}\n' "$reference_bases" "$mate1_reads" "$mate2_reads" "$mate1_corrected" "$mate2_corrected" "$mate1_bytes" "$mate2_bytes" > /result/metrics.json
