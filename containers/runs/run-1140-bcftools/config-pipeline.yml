commands:
  version: [bcftools, --version]
  help: [bcftools, --help]
  real:
    - sh
    - -c
    - >-
      set -eu;
      {
      bcftools mpileup --threads 3 -f /input/EquCab3.0.fna -R /input/known-sites.bed -q 20 -Q 20 -a FORMAT/DP,FORMAT/AD -Ou /input/ERR2112767.sorted.bam |
      bcftools call --threads 3 -A -i -m -C alleles -T /input/known-sites.alleles.tsv -Oz -o /result/ERR2112767.known-sites.vcf.gz;
      bcftools index -f /result/ERR2112767.known-sites.vcf.gz;
      bcftools stats /result/ERR2112767.known-sites.vcf.gz > /result/ERR2112767.known-sites.stats.txt;
      bcftools query -f '[%GT\t%DP\n]' /result/ERR2112767.known-sites.vcf.gz |
      awk 'BEGIN {total=0; covered=0; called=0; alternate=0; depth=0} {total++; if ($2 != "." && $2 + 0 > 0) {covered++; depth += $2} if ($1 != "." && $1 != "./." && $1 != ".|.") called++; if ($1 ~ /1/) alternate++} END {mean=(covered > 0 ? depth / covered : 0); printf "{\"total_records\":%d,\"covered_sites\":%d,\"called_genotypes\":%d,\"alternate_genotypes\":%d,\"mean_depth_at_covered_sites\":%.6f}\n", total, covered, called, alternate, mean}' > /result/metrics.json;
      bcftools view -h /result/ERR2112767.known-sites.vcf.gz | grep -q '^##contig=<ID=NC_009144.3';
