schema_version = "bijux.container.stage_benchmarks.v1"

[[campaigns]]
run_id = "run-2001"
slug = "bam-genotyping"
domain = "bam"
stage_id = "bam.genotyping"
scientific_question = "How reliably and efficiently does each retained BAM genotyping tool recover independently catalogued EquCab3 candidate sites from a real low-coverage ancient horse alignment?"
comparison_scope = "candidate-site genotyping on one governed 10 Mb EquCab3 interval"
tool_ids = ["bcftools"]
corpus_catalog_ids = ["ena-prjeb22390-err2112767-bam"]
reference_catalog_ids = ["equcab3-gcf-002863925.1"]
database_catalog_ids = [
  "ensembl-113-equcab3-refseq-known-sites-10mb",
  "ensembl-113-equcab3-refseq-genotyping-inputs-10mb",
]
input_size_keys = ["bam_input_bytes", "reference_input_bytes", "database_input_bytes"]
result_artifact = "genotypes.tsv"
runtime = "apptainer"
scheduler = "slurm"
container_only = true
threads = 4
warmup_repetitions = 1
measured_repetitions = 3
cache_policy = "warm"
result_root_template = "results/benchmarks/{run_id}-{slug}/{tool_id}"
accuracy_claim = "candidate_site_recovery_not_genotype_truth"
interpretation = "This execution establishes reproducible candidate-site genotyping and resource use for the retained tool set. It does not establish genotype accuracy because no sample-level truth genotype is available."
performance_metrics = [
  "wall_seconds",
  "cpu_seconds",
  "peak_rss_kib",
  "input_bytes",
  "output_bytes",
]
scientific_metrics = [
  "total_records",
  "covered_sites",
  "called_genotypes",
  "alternate_genotypes",
  "mean_depth_at_covered_sites",
]
limitations = [
  "The Ensembl panel is independent candidate-site evidence but is not a sample-level genotype truth set.",
  "The first 10 Mb of chromosome 1 is a qualification interval, not a genome-wide accuracy estimate.",
  "Warm-cache repetitions measure stable tool execution after one unmeasured warmup; they do not estimate cold filesystem startup cost.",
]

[[campaigns]]
run_id = "run-2002"
slug = "bam-coverage"
domain = "bam"
stage_id = "bam.coverage"
scientific_question = "How efficiently and consistently do the retained BAM coverage tools summarize reference-wide breadth and depth for the same real low-coverage ancient horse alignment?"
comparison_scope = "whole-reference coverage summaries from one governed coordinate-sorted EquCab3 BAM"
tool_ids = ["bedtools", "mosdepth", "samtools"]
corpus_catalog_ids = ["ena-prjeb22390-err2112767-bam"]
reference_catalog_ids = ["equcab3-gcf-002863925.1"]
database_catalog_ids = []
input_size_keys = ["bam_input_bytes", "bam_index_input_bytes", "reference_index_input_bytes"]
result_artifact = "coverage-summary.tsv"
runtime = "apptainer"
scheduler = "slurm"
container_only = true
threads = 4
warmup_repetitions = 1
measured_repetitions = 3
cache_policy = "warm"
result_root_template = "results/benchmarks/{run_id}-{slug}/{tool_id}"
accuracy_claim = "cross_tool_coverage_summary_consistency_not_truth_accuracy"
interpretation = "This campaign compares resource use, repeatability, and agreement of coverage summaries over one real ancient horse BAM. Agreement is a consistency check, not an accuracy claim against an independent coverage truth set."
performance_metrics = [
  "wall_seconds",
  "cpu_seconds",
  "peak_rss_kib",
  "input_bytes",
  "output_bytes",
]
scientific_metrics = [
  "reference_bases",
  "covered_bases",
  "coverage_fraction",
  "mean_depth",
]
limitations = [
  "The corpus is one low-coverage ancient horse library and does not represent high-depth, long-read, or cohort workloads.",
  "Cross-tool agreement can reveal integration defects but does not establish accuracy without an independent truth coverage surface.",
  "Warm-cache repetitions measure stable execution after one warmup and exclude cold shared-filesystem startup.",
]
