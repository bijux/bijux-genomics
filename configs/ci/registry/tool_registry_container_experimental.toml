[[tools]]
id = "bamutil"
tool_id = "bamutil"
status = "experimental"
domain = "bam"
domains = ["bam"]
container = true
runtimes = ["docker", "apptainer"]
expected_bin = "bamutil"
smoke_version_cmd = "bamutil --version"
smoke_help_cmd = "bamutil --help"
dockerfile = "containers/docker/Dockerfile.arm64.bamutil"
apptainer_def = "containers/apptainer/bamutil.def"

