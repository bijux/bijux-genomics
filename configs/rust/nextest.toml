# schema_version = 1
# owner = bijux-dna-infra
# purpose = Contract config for configs/rust/nextest.toml
# authority = bijux-dna-infra
# stability = stable
# last_updated = 2026-03-25

[profile.default]
retries = { count = 1, backoff = "fixed", delay = "1s" }

[store]
dir = "artifacts/rust/test/nextest-store"

[test-groups.benchmark-repository-mutators]
max-threads = 1

[profile.ci]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = false
test-threads = 1
slow-timeout = { period = "1s", terminate-after = 1 }
failure-output = "immediate"
success-output = "never"
status-level = "pass"

[profile.full]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = false
test-threads = 8
slow-timeout = "1s"
failure-output = "immediate"
success-output = "never"
status-level = "pass"

[[profile.full.overrides]]
filter = 'package(bijux-dna) and binary(/^(?:bench_local_adna_micro_pipeline|bench_local_adna_micro_pipeline_file|bench_local_amplicon_micro_pipeline|bench_local_amplicon_micro_pipeline_file|bench_local_bam_micro_smoke_subset|bench_local_core_germline_micro_pipeline|bench_local_core_germline_micro_pipeline_file|bench_local_edna_micro_pipeline|bench_local_edna_micro_pipeline_file|bench_run_micro)$/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and binary(/^(?:bench_active_scope_validate_fast|bench_local_all_domain_fake_failures|bench_local_all_domain_fake_failures_file|bench_local_vcf_no_empty_output_file|bench_local_vcf_stage_catalog_ready|bench_local_vcf_stage_catalog_ready_file)$/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and binary(/^(?:bench_readiness_all_domain_failure_classification_file|bench_readiness_all_domain_local_harness_complete|bench_readiness_all_domain_local_harness_complete_file|bench_readiness_all_domain_missing_result_test|bench_readiness_all_domain_missing_result_test_file|bench_readiness_bam_kinship_complete|bench_readiness_bam_kinship_complete_file|bench_readiness_essential_pipelines_local_complete|bench_readiness_essential_pipelines_local_complete_file|bench_readiness_full_benchmark_dashboard|bench_readiness_full_benchmark_report|bench_readiness_full_benchmark_result_collector|bench_readiness_micro_benchmark_execution_ready|bench_readiness_micro_benchmark_execution_ready_file|bench_readiness_stage_tool_benchmark_ready|bench_readiness_stage_tool_benchmark_ready_file|bench_readiness_vcf_call_gl_ready|bench_readiness_vcf_missing_result_report)$/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and binary(/^(?:fixtures_validate_all|fixtures_validate_expected_fastq_duplicates_truth|fixtures_validate_expected_fastq_duplicates_truth_stdout|fixtures_validate_expected_fastq_trimming_truth|fixtures_validate_expected_fastq_trimming_truth_stdout|fixtures_validate_fastq_duplicates_truth|fixtures_validate_fastq_duplicates_truth_stdout)$/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and test(/^(?:bench_local_vcf_|bench_local_validate_vcf_smoke_suite_ready)/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and test(/^commands::benchmark::(?:local_hpc_asset_staging_manifest|local_vcf_demography_smoke|local_vcf_ibd_smoke|local_vcf_pca_smoke|local_vcf_population_structure_smoke)::tests::/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and test(/^commands::benchmark::readiness::(?:all_domain_missing_result_audit|all_domain_parser_collector|all_domain_rendered_commands|bam_all_retained_tools_complete|fastq_adapter_output_contract|fastq_duplicate_stages_ready|fastq_trim_stages_ready|output_contract_audit|rendered_command_argv|rendered_commands|stage_tool_benchmark_ready)::tests::/)'
test-group = 'benchmark-repository-mutators'

[profile.slow]
retries = { count = 1, backoff = "fixed", delay = "1s" }

[profile.e2e]
retries = { count = 0, backoff = "fixed", delay = "1s" }

[profile.science]
retries = { count = 1, backoff = "fixed", delay = "1s" }

[profile.flake]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = true
test-threads = 1
failure-output = "immediate"
success-output = "never"
status-level = "fail"

[profile.fast-unit]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = true
test-threads = 8
slow-timeout = { period = "1s", terminate-after = 15 }
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"

[profile.slow-integration]
retries = { count = 1, backoff = "fixed", delay = "1s" }
fail-fast = false
test-threads = 4
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"

[profile.certification]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = true
test-threads = 1
failure-output = "immediate-final"
success-output = "never"
status-level = "skip"
