# schema_version = 1
# owner = bijux-dna-infra
# purpose = Contract config for configs/rust/nextest.toml
# authority = bijux-dna-infra
# stability = stable
# last_updated = 2026-03-25

[profile.default]
retries = { count = 1, backoff = "fixed", delay = "1s" }

[store]
dir = "artifacts/rust/test/nextest-store"

[test-groups.benchmark-repository-mutators]
max-threads = 1

[profile.ci]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = false
test-threads = 1
slow-timeout = { period = "1s", terminate-after = 1 }
failure-output = "immediate"
success-output = "never"
status-level = "pass"

[profile.full]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = false
test-threads = 8
slow-timeout = "1s"
failure-output = "immediate"
success-output = "never"
status-level = "pass"

# Only these qualified cases own private repository/output and child runtime roots.
# Keep adjacent readiness and CLI generators serialized until their effects are isolated.
[[profile.full.overrides]]
filter = """
package(bijux-dna) and binary(=benchmark_readiness) and ( \
    test(=parser_failures::fastq_bam::bench_readiness_parser_failure_audit_report_structures_parser_errors) or \
    test(=parser_failures::fastq_bam::bench_readiness_parser_failure_audit_file_writes_self_describing_report) or \
    test(=parser_failures::vcf::bench_readiness_vcf_parser_failure_audit_report_governed_failure_rows) or \
    test(=parser_failures::vcf::bench_readiness_vcf_parser_failure_audit_writes_governed_json_file) \
)"""
test-group = '@global'

# Adapter coverage owns selected fixture inputs, private Git authority and runtime roots.
[[profile.full.overrides]]
filter = """
package(bijux-dna) and binary(=benchmark_readiness) and ( \
    test(=readiness::adapters::bench_readiness_all_domain_adapter_coverage_reports_complete_active_rows) or \
    test(=readiness::adapters_tsv::bench_readiness_all_domain_adapter_coverage_writes_governed_tsv_file) \
)"""
test-group = '@global'

[[profile.full.overrides]]
filter = """
package(bijux-dna) and binary(=bench_readiness_bam) and ( \
    test(=bam::genotypes::genotyping_complete::bench_readiness_bam_genotyping_complete_reports_governed_row) or \
    test(=bam::genotypes::genotyping_complete_file::bench_readiness_bam_genotyping_complete_writes_governed_json_file) or \
    test(=bam::genotypes::kinship_complete::bench_readiness_bam_kinship_complete_reports_governed_rows) or \
    test(=bam::genotypes::kinship_complete_file::bench_readiness_bam_kinship_complete_writes_governed_json_file) or \
    test(=bam::genotypes::kinship_ready::bench_readiness_bam_kinship_ready_reports_complete_governed_rows) or \
    test(=bam::genotypes::kinship_ready_file::bench_readiness_bam_kinship_ready_writes_governed_json_file) or \
    test(=bam::genotypes::recalibration_complete::bench_readiness_bam_recalibration_complete_reports_governed_row) or \
    test(=bam::genotypes::recalibration_complete_file::bench_readiness_bam_recalibration_complete_writes_governed_json_file) or \
    test(=bam::genotypes::recalibration_genotyping_ready::bench_readiness_bam_recalibration_genotyping_ready_reports_complete_governed_rows) or \
    test(=bam::genotypes::recalibration_genotyping_ready_file::bench_readiness_bam_recalibration_genotyping_ready_writes_governed_json_file) \
)"""
test-group = '@global'

[[profile.full.overrides]]
filter = """
package(bijux-dna) and binary(=bijux_dna) and ( \
    test(=commands::benchmark::local_hpc_asset_staging_manifest::tests::loaded_hpc_asset_staging_manifest_matches_governed_render) or \
    test(=commands::benchmark::local_hpc_asset_staging_manifest::tests::rendered_hpc_asset_staging_manifest_covers_all_domain_jobs) or \
    test(=commands::benchmark::local_hpc_asset_staging_manifest::tests::validated_hpc_asset_staging_manifest_rejects_stale_selected_job_count) \
)"""
test-group = '@global'

# These suites create an independent RepoSandbox for every test and bind all CLI
# repository/output roots to it. They can use the global worker pool within a shard.
[[profile.full.overrides]]
filter = '(package(bijux-dna) and binary(/^(?:bench_local_hpc_dry_run_ready|bench_readiness_operational_benchmark_ready|bench_readiness_all_domain_local_harness_complete|bench_readiness_full_benchmark_(?:report|result_collector|dashboard))$/)) or (package(bijux-dna) and binary(=bench_readiness_all_domain_completion) and test(=operational_benchmark::bench_readiness_all_domain_local_operational_benchmark_complete_reports_green_surface))'
test-group = '@global'
# Start the measured long independent workflows before ordinary cases.
priority = 100

# These micro workflows bind child commands to fresh per-test repository roots.
# The SLURM file contract already uses that same sandbox boundary.
[[profile.full.overrides]]
filter = '(package(bijux-dna) and binary(/^(?:bench_local_bam_micro_smoke_subset|bench_local_edna_micro_pipeline(?:_file)?)$/)) or (package(bijux-dna) and binary(=bench_local_slurm) and test(=slurm::all_domain::scripts_file::bench_local_render_all_domain_slurm_scripts_writes_governed_root))'
test-group = '@global'
priority = 90

# Other CLI generators retain serialization until their output isolation is qualified.
[[profile.full.overrides]]
filter = 'package(bijux-dna) and binary(/^(?:bench_|benchmark_readiness$|config_|dev_crates_|fixtures_|plan_validate_)/)'
test-group = 'benchmark-repository-mutators'

[[profile.full.overrides]]
filter = 'package(bijux-dna) and test(/^commands::benchmark::/)'
test-group = 'benchmark-repository-mutators'

[profile.slow]
retries = { count = 1, backoff = "fixed", delay = "1s" }

[profile.e2e]
retries = { count = 0, backoff = "fixed", delay = "1s" }

[profile.science]
retries = { count = 1, backoff = "fixed", delay = "1s" }

[profile.flake]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = true
test-threads = 1
failure-output = "immediate"
success-output = "never"
status-level = "fail"

[profile.fast-unit]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = true
test-threads = 8
slow-timeout = { period = "1s", terminate-after = 15 }
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"

[profile.slow-integration]
retries = { count = 1, backoff = "fixed", delay = "1s" }
fail-fast = false
test-threads = 4
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"

[profile.certification]
retries = { count = 0, backoff = "fixed", delay = "1s" }
fail-fast = true
test-threads = 1
failure-output = "immediate-final"
success-output = "never"
status-level = "skip"
